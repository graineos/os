name: Extract Ruche Desktop Companion 0.7 source
on:
  push:
    branches: [feature/desktop-companion-0-7]
    paths:
      - 'desktop-companion/source-v0.7.zip'
      - '.github/workflows/extract-ruche-companion.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract audited source without touching the host OS or other modules
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          base = pathlib.Path('desktop-companion')
          with zipfile.ZipFile(base / 'source-v0.7.zip') as archive:
              for item in archive.infolist():
                  name = pathlib.PurePosixPath(item.filename)
                  if item.is_dir(): continue
                  if not name.parts or name.parts[0] != 'ruche-os-desktop': raise ValueError('Unexpected archive root')
                  rel = pathlib.PurePosixPath(*name.parts[1:])
                  if any(part in ('..', '.') for part in rel.parts) or rel.is_absolute(): raise ValueError('Unsafe archive path')
                  if not rel.parts or rel.parts[0] == '.github' or rel.name in ('README.md', 'README-0.7.md'): continue
                  if rel.parts[0] not in ('src', 'tests') and rel.name not in ('package.json', 'DEMARRER-WINDOWS.bat','CAHIER-FENETRES-0.7.md','CAHIER-DES-CHARGES-INTEGRAL.md','CHANGELOG.md','ETAT-DES-TESTS.md','ETUDE-WINMAC-DOCKABLE.md','CHANGELOG-0.7.md'):
                      continue
                  dest=base.joinpath(*rel.parts)
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(archive.read(item))
          for required in ('src/main.cjs','src/ui.js','src/style.css','src/finder-service.cjs','package.json','tests/core.test.cjs'):
              if not (base / required).is_file(): raise RuntimeError('Missing '+required)
          PY
      - name: Verify JavaScript and unit tests
        working-directory: desktop-companion
        run: npm run check
      - name: Commit expanded source to the same feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop-companion/
          if git diff --cached --quiet; then
            echo 'Source already expanded'
            exit 0
          fi
          git commit -m 'feat(desktop): expand verified 0.7 source files'
          git push origin "HEAD:${GITHUB_REF_NAME}"
