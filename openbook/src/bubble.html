<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>OpenBook Gemini</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/bubble.js"></script>
</head>
<body class="bubble-page">
  <form id="bubble" class="bubble" autocomplete="off">
    <span class="bubble-spark" aria-hidden="true"></span>
    <input id="bubble-input" placeholder="Demander à Gemini…" aria-label="Demander à Gemini">
    <button class="icon-btn filled" title="Envoyer"><span class="icon" data-icon="sparkle"></span></button>
    <p id="bubble-done" class="bubble-done" hidden>Question copiée, colle-la avec Ctrl+V</p>
  </form>
</body>
</html>
