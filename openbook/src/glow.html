<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>OpenBook Glowbar</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    .bar {
      position: absolute; left: 0; right: 0; top: 0; height: 4px;
      border-radius: 0 0 4px 4px;
      background: linear-gradient(90deg, #4285f4, #ea4335 33%, #fbbc04 66%, #34a853);
      box-shadow: 0 0 10px 2px rgba(66, 133, 244, .55), 0 0 16px 2px rgba(234, 67, 53, .35);
      opacity: 0; transform-origin: left center;
    }
    .sweep {
      animation: sweep 1.6s cubic-bezier(.2, 0, 0, 1) forwards;
      -webkit-mask: linear-gradient(90deg, transparent, #000 20%, #000 80%, transparent) 0 0 / 40% 100% no-repeat;
      mask: linear-gradient(90deg, transparent, #000 20%, #000 80%, transparent) 0 0 / 40% 100% no-repeat;
    }
    @keyframes sweep {
      0% { opacity: 0; -webkit-mask-position: -60% 0; mask-position: -60% 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { opacity: 0; -webkit-mask-position: 160% 0; mask-position: 160% 0; }
    }
    .pulse { animation: pulse 1.8s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    .battery { opacity: 1; transition: transform 700ms cubic-bezier(.2, 0, 0, 1), opacity 400ms ease; }
    .fade { opacity: 0 !important; transition: opacity 500ms ease; }
    @media (prefers-reduced-motion: reduce) {
      .sweep { animation: none; opacity: 0; }
      .pulse { animation: none; opacity: .8; }
    }
  </style>
  <script type="module" src="js/glow.js"></script>
</head>
<body><div id="bar" class="bar"></div></body>
</html>
