<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenBook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div id="wallpaper" aria-hidden="true"></div>

  <!-- 1. Barre du haut -->
  <header id="topbar">
    <div class="tb-left">
      <span id="clock" class="tb-time">--:--</span>
      <span id="date" class="tb-date"></span>
    </div>
    <button id="status" class="tb-status" aria-haspopup="dialog" aria-controls="qs" aria-expanded="false" title="Réglages rapides et notifications">
      <span id="dnd-indicator" class="icon" hidden></span>
      <span id="net-icon" class="icon"></span>
      <span id="bat-icon" class="icon"></span>
      <span id="bat-text" class="tb-bat-text"></span>
    </button>
  </header>

  <!-- Réglages rapides + notifications -->
  <section id="qs" class="panel" role="dialog" aria-label="Réglages rapides et notifications" hidden>
    <div class="qs-card">
      <div class="qs-head">
        <div>
          <div id="qs-time" class="qs-time"></div>
          <div id="qs-date" class="qs-date"></div>
        </div>
        <div id="qs-battery" class="qs-battery"></div>
      </div>
      <div class="qs-tiles">
        <button class="tile" data-tile="dark" aria-pressed="false">
          <span class="icon" data-icon="dark"></span>
          <span class="tile-text"><span class="tile-label">Thème sombre</span><span class="tile-state"></span></span>
        </button>
        <button class="tile" data-tile="dnd" aria-pressed="false">
          <span class="icon" data-icon="dnd"></span>
          <span class="tile-text"><span class="tile-label">Ne pas déranger</span><span class="tile-state"></span></span>
        </button>
        <button class="tile" data-tile="fullscreen" aria-pressed="true">
          <span class="icon" data-icon="fullscreen"></span>
          <span class="tile-text"><span class="tile-label">Plein écran</span><span class="tile-state"></span></span>
        </button>
      </div>
      <label class="qs-slider" title="La luminosité est gérée par Windows : ce curseur ne peut rien contrôler.">
        <span class="icon" data-icon="brightness"></span>
        <input id="brightness" type="range" min="0" max="100" value="70" disabled aria-label="Luminosité (non disponible)">
        <span class="qs-slider-note">Géré par Windows</span>
      </label>
    </div>

    <div class="qs-card qs-notifs">
      <div class="qs-notifs-head">
        <span>Notifications</span>
        <button id="notif-clear" class="text-btn">Tout effacer</button>
      </div>
      <ul id="notif-list" class="notif-list"></ul>
      <p id="notif-empty" class="notif-empty">Aucune notification</p>
    </div>

    <div class="qs-power">
      <button class="pill-btn tonal" data-power="lock"><span class="icon" data-icon="lock"></span>Verrouiller</button>
      <button class="pill-btn tonal" data-power="restart"><span class="icon" data-icon="restart"></span>Redémarrer</button>
      <button class="pill-btn tonal" data-power="shutdown"><span class="icon" data-icon="power"></span>Éteindre</button>
      <button class="pill-btn outline" data-power="quit"><span class="icon" data-icon="exit"></span>Quitter OpenBook</button>
    </div>
  </section>

  <!-- 3. Tiroir d'applis -->
  <section id="drawer" class="panel" role="dialog" aria-label="Toutes les applis" hidden>
    <form id="search" class="search" role="search" autocomplete="off">
      <span class="icon" data-icon="search"></span>
      <input id="search-input" type="text" placeholder="Rechercher des applis ou sur le Web" aria-label="Rechercher">
      <button id="ask-gemini" type="button" class="pill-btn tonal small"><span class="icon" data-icon="sparkle"></span>Demander à Gemini</button>
    </form>
    <div id="app-grid" class="app-grid" role="list"></div>
    <p id="grid-empty" class="grid-empty" hidden>Aucune appli. Appuie sur Entrée pour chercher sur Google.</p>
  </section>

  <!-- 2. Dock -->
  <nav id="dock" aria-label="Dock">
    <button id="launcher" class="launcher" aria-haspopup="dialog" aria-controls="drawer" aria-expanded="false" title="Toutes les applis">
      <span class="launcher-o" aria-hidden="true"></span>
    </button>
    <div id="dock-apps" class="dock-apps" role="list"></div>
  </nav>

  <div id="menu" class="menu" role="menu" hidden></div>

  <dialog id="confirm" class="confirm">
    <form method="dialog">
      <span id="confirm-icon" class="icon confirm-icon"></span>
      <h2 id="confirm-title"></h2>
      <p id="confirm-text"></p>
      <div class="confirm-actions">
        <button value="cancel" class="pill-btn text">Annuler</button>
        <button value="ok" id="confirm-ok" class="pill-btn filled">Confirmer</button>
      </div>
    </form>
  </dialog>

  <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
